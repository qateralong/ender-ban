# published a build for 26.3 yet even though it's Mojang's current stable
# release (Fabric already supports it, see ../fabric/gradle.properties).
# Bump minecraft_version/forge_version once a 26.3 entry shows up there.
minecraft_version=26.2
forge_version=65.1.0

